name: L2 recovery cleanup
run-name: L2 recovery cleanup 5b1f73456 20261117
"on":
  push:
    branches:
      - experiment/l2-upstream-hold-rerun-cleanup-20261117
    paths:
      - .github/workflows/perf-l2-cleanup.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: perf
    timeout-minutes: 5
    steps:
      - name: Stop cancelled L2 experiments and report aggregate counts
        shell: bash
        run: |
          python3 - <<'PY_CLEANUP'
          import concurrent.futures, json, shlex, subprocess
          remote = 'import os, signal, time, json, pwd\nfrom pathlib import Path\nif pwd.getpwuid(os.getuid()).pw_name != "ci-runner":\n    raise SystemExit("Expected the existing CI account on this host")\nallowed = {\n    "/nfs/home/ci-runner/perf-report/cr261112-5b1f73456-SDBPLRUConfig/emu-verilator",\n    "/nfs/home/ci-runner/perf-report/cr261112-5b1f73456-SDBPConfig/emu-verilator",\n}\ndef identity(pid):\n    path = Path("/proc") / str(pid)\n    try:\n        if path.stat().st_uid != os.getuid(): return None\n        command = (path / "cmdline").read_bytes().split(b"\\0")[0].decode()\n        fields = (path / "stat").read_text().split(") ", 1)[1].split()\n        if command not in allowed or fields[0] == "Z": return None\n        return fields[19]\n    except (FileNotFoundError, ProcessLookupError, PermissionError): return None\ntargets = {int(path.name): identity(int(path.name)) for path in Path("/proc").iterdir() if path.name.isdigit()}\ntargets = {pid: start for pid, start in targets.items() if start is not None}\ndef remaining():\n    return [pid for pid, start in targets.items() if identity(pid) == start]\nfor sig, timeout in [(signal.SIGINT, 10), (signal.SIGTERM, 3), (signal.SIGKILL, 3)]:\n    for pid in remaining():\n        try: os.kill(pid, sig)\n        except ProcessLookupError: pass\n    end = time.monotonic() + timeout\n    while remaining() and time.monotonic() < end: time.sleep(0.2)\n    if not remaining(): break\nleft = remaining()\nprint(json.dumps({"stopped_processes": len(targets) - len(left), "remaining_processes": len(left)}))\nif left: raise SystemExit(1)\n'
          hosts = ['open27', 'open25', 'open12']
          def stop(host):
              try:
                  p = subprocess.run(['ssh', '-T', '-o', 'BatchMode=yes', '-o', 'ConnectTimeout=8',
                    '-o', 'ConnectionAttempts=1', '-o', 'ServerAliveInterval=5', '-o', 'ServerAliveCountMax=2',
                    host, 'python3 -c ' + shlex.quote(remote)], capture_output=True, text=True, timeout=40)
                  return {'returncode': p.returncode, 'summary': json.loads(p.stdout) if p.returncode == 0 else 'Cleanup failed'}
              except (subprocess.TimeoutExpired, ValueError):
                  return {'returncode': 124, 'summary': 'Cleanup unavailable'}
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              results = list(pool.map(stop, hosts))
          for result in results: print(json.dumps(result), flush=True)
          if any(result['returncode'] != 0 for result in results): raise SystemExit(1)
          PY_CLEANUP
